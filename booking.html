<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book IPL Tickets</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 14px; font-family: Arial, sans-serif; background: #f2f5fb; color: #17213b; }
    .form-card { max-width: 620px; margin: 20px auto; padding: 28px; background: #fff; border-radius: 12px; box-shadow: 0 5px 22px #102a6318; }
    h1 { margin-top: 0; text-align: center; color: #102a63; }
    .intro { text-align: center; color: #58647a; margin-bottom: 25px; }
    label, legend { display: block; margin: 15px 0 7px; font-weight: bold; }
    input, select { width: 100%; padding: 11px; border: 1px solid #bdc7d8; border-radius: 6px; font-size: 15px; }
    fieldset { border: 1px solid #bdc7d8; border-radius: 6px; margin-top: 16px; padding: 8px 14px 14px; }
    fieldset label { display: inline-flex; align-items: center; gap: 7px; margin: 8px 18px 0 0; font-weight: normal; }
    fieldset input { width: auto; }
    .buttons { display: flex; gap: 12px; margin-top: 24px; }
    button { flex: 1; padding: 12px; border: 0; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .submit { background: #e85b28; color: white; }
    .reset { background: #e4e9f2; color: #17213b; }
    .back { display: block; text-align: center; margin-top: 20px; color: #102a63; }
    button:hover { opacity: .9; }
  </style>
</head>
<body>
  <main class="form-card">
    <h1>IPL Ticket Booking</h1>
    <p class="intro">Fill in the details below to book your match tickets.</p>

    <form action="#" method="get">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name"
             minlength="3" maxlength="40" pattern="[A-Za-z ]+" title="Use letters and spaces only" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number"
             pattern="[6-9][0-9]{9}" minlength="10" maxlength="10"
             title="Enter a valid 10-digit Indian mobile number" required>

      <label for="match">Select Match</label>
      <select id="match" name="match" required>
        <option value="">-- Choose a match --</option>
        <option value="RCB vs CSK">Royal Challengers Bengaluru vs Chennai Super Kings</option>
        <option value="MI vs KKR">Mumbai Indians vs Kolkata Knight Riders</option>
        <option value="SRH vs RR">Sunrisers Hyderabad vs Rajasthan Royals</option>
        <option value="DC vs PBKS">Delhi Capitals vs Punjab Kings</option>
      </select>

      <label for="stand">Stand Category</label>
      <select id="stand" name="stand" required>
        <option value="">-- Choose a stand --</option>
        <option value="General">General Stand</option>
        <option value="Premium">Premium Stand</option>
        <option value="VIP">VIP Stand</option>
        <option value="Corporate">Corporate Box</option>
      </select>

      <label for="tickets">Number of Tickets</label>
      <input type="number" id="tickets" name="tickets" min="1" max="10" value="1" required>

      <fieldset>
        <legend>Booking Preference</legend>
        <label><input type="radio" name="preference" value="together" checked> Seats together</label>
        <label><input type="radio" name="preference" value="aisle"> Aisle seats preferred</label>
      </fieldset>

      <div class="buttons">
        <button class="submit" type="submit">Submit Booking</button>
        <button class="reset" type="reset">Reset Form</button>
      </div>
    </form>
    <a class="back" href="index.html">← Back to Home</a>
  </main>
</body>
</html>

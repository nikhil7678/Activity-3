<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Ticket Booking</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 14px; font-family: Arial, sans-serif; background: #f2f5fb; color: #17213b; }
    header { text-align: center; color: white; background: #102a63; padding: 20px; border-radius: 10px; }
    .form-card { max-width: 650px; margin: 24px auto; padding: 28px; background: #fff; border-radius: 12px; box-shadow: 0 5px 22px #102a6318; }
    h1, h2 { color: #102a63; text-align: center; }
    header h1 { color: white; margin: 0; }
    .intro { text-align: center; color: #58647a; margin-bottom: 25px; line-height: 1.5; }
    .field { margin-top: 16px; }
    label, legend { display: block; margin-bottom: 7px; font-weight: bold; }
    input, select { width: 100%; padding: 11px; border: 1px solid #bdc7d8; border-radius: 6px; font-size: 15px; }
    input:focus, select:focus { outline: 2px solid #7899df; border-color: #315da8; }
    fieldset { border: 1px solid #bdc7d8; border-radius: 6px; margin-top: 18px; padding: 12px 14px; }
    fieldset label, .terms { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-weight: normal; }
    fieldset input, .terms input { width: auto; }
    .terms { margin-top: 18px; }
    .buttons { display: flex; gap: 12px; margin-top: 24px; }
    button { flex: 1; padding: 12px; border: 0; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .submit { background: #e85b28; color: white; }
    .reset { background: #e4e9f2; color: #17213b; }
    .back { display: block; text-align: center; margin-top: 20px; color: #102a63; }
    #confirmation { display: none; margin-top: 18px; padding: 14px; background: #e9f7ee; border: 1px solid #9bd3ad; border-radius: 6px; color: #185b30; }
    button:hover { opacity: .9; }
    @media (max-width: 520px) { .form-card { padding: 20px; } .buttons { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <h1>IPL Ticket Booking</h1>
    <p>Choose your match and book your seat</p>
  </header>
  <main class="form-card">
    <h2>Ticket Booking Form</h2>
    <p class="intro">Enter your details below. Complete all required fields to submit your booking.</p>

    <form id="bookingForm">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" minlength="3" maxlength="50" pattern="[A-Za-z][A-Za-z .'-]{2,49}" title="Enter 3 to 50 characters using letters and common name punctuation." autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" maxlength="100" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}" minlength="10" maxlength="10" title="Enter a valid 10-digit Indian mobile number." autocomplete="tel" required>
      </div>
      <div class="field">
        <label for="match">Select Match</label>
        <select id="match" name="match" required>
          <option value="">-- Choose a match --</option>
          <option value="RCB vs CSK">Royal Challengers Bengaluru vs Chennai Super Kings</option>
          <option value="MI vs KKR">Mumbai Indians vs Kolkata Knight Riders</option>
          <option value="SRH vs RR">Sunrisers Hyderabad vs Rajasthan Royals</option>
          <option value="DC vs PBKS">Delhi Capitals vs Punjab Kings</option>
          <option value="GT vs LSG">Gujarat Titans vs Lucknow Super Giants</option>
        </select>
      </div>
      <div class="field">
        <label for="stand">Stand Category</label>
        <select id="stand" name="stand" required>
          <option value="">-- Choose a stand --</option>
          <option value="General">General Stand</option>
          <option value="Premium">Premium Stand</option>
          <option value="VIP">VIP Stand</option>
          <option value="Corporate Box">Corporate Box</option>
        </select>
      </div>
      <div class="field">
        <label for="tickets">Number of Tickets</label>
        <input type="number" id="tickets" name="tickets" min="1" max="10" step="1" value="1" required>
      </div>
      <fieldset>
        <legend>Booking Preference</legend>
        <label><input type="radio" name="preference" value="Seats together" checked> Seats together</label>
        <label><input type="radio" name="preference" value="Aisle seats"> Aisle seats preferred</label>
        <label><input type="radio" name="preference" value="No preference"> No preference</label>
      </fieldset>
      <label class="terms"><input type="checkbox" name="confirmation" required> I confirm that the details entered are correct.</label>
      <div class="buttons">
        <button class="submit" type="submit">Submit Booking</button>
        <button class="reset" type="reset">Reset Form</button>
      </div>
    </form>
    <div id="confirmation" role="status" aria-live="polite"></div>
    <a class="back" href="index.html">← Back to Home</a>
  </main>
  <script>
    const form = document.getElementById('bookingForm');
    const message = document.getElementById('confirmation');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      const details = new FormData(form);
      message.textContent = 'Thank you, ' + details.get('name') + '! Your demo booking is complete. Match: ' +
        details.get('match') + '. Stand: ' + details.get('stand') + '. Tickets: ' + details.get('tickets') + '.';
      message.style.display = 'block';
    });

    form.addEventListener('reset', function () {
      message.textContent = '';
      message.style.display = 'none';
    });
  </script>
</body>
</html>
